[package]
name = "samplr-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "samplr's graphical interface: the sample list, preview, tags and collections."
repository = "https://github.com/nd-/samplr"
readme = "../README.md"

[build-dependencies]
# Reads tauri.conf.json at build time
tauri-build = { version = "2", features = [] }

[dependencies]
# The shared code: database, waveforms, file reading
samplr = { path = ".." }
# Database access (same version as the library uses)
rusqlite = "0.41"
# Turns the commands' answers into JSON for the page (already compiled for Tauri)
serde = { version = "1", features = ["derive"] }
# Absolute paths written like the library's (no `\\?\` prefix on Windows)
dunce = "1.0"
# Preview playback (same version as the library uses)
rodio = { version = "0.23", features = ["symphonia-all"] }
# Desktop window showing the web interface of ui/, through the system's web
# engine (WebKitGTK on Linux, WKWebView on Mac, WebView2 on Windows)
tauri = { version = "2", features = [] }
# Drag samples out of the window into a DAW or a file manager, through each
# system's native drag and drop (the web page alone can only drag inside it)
tauri-plugin-drag = "2"
# The system's own "choose a folder" window, to add a sample folder
tauri-plugin-dialog = "2"
# The window's size, position and maximised state, saved on closing and
# brought back at the next launch
tauri-plugin-window-state = "2"
ssstretch = "0.1.0"
