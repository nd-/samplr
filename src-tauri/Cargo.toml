[package]
name = "samplr-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
# Reads tauri.conf.json at build time
tauri-build = { version = "2", features = [] }

[dependencies]
# The shared code: database, waveforms, file reading
samplr = { path = ".." }
# Desktop window showing the web interface of ui/, through the system's web
# engine (WebKitGTK on Linux, WKWebView on Mac, WebView2 on Windows)
tauri = { version = "2", features = [] }
