# Every test (tests/run.sh) at each push to main and each pull request: on
# Linux, the real app's too, in a virtual display; on macOS, where tauri-driver
# cannot drive the web view, the Rust and interface tests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the code.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            webkit2gtk-driver xvfb ffmpeg pulseaudio libasound2-plugins

      # The runner has no sound card, and the app's audio thread stops without
      # an output: a silent one, which ALSA reaches through PulseAudio.
      - name: A silent audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: The interface tests' tools
        working-directory: tests/ui
        run: npm ci && npx playwright install --with-deps chromium

      - name: Every test
        run: xvfb-run -a ./tests/run.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: The interface tests' tools
        working-directory: tests/ui
        run: npm ci && npx playwright install chromium

      - name: Every test
        run: ./tests/run.sh
