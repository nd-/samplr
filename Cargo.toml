[package]
name = "samplr"
version = "0.1.0"
edition = "2024"

[dependencies]
# Command-line argument parsing, described by a `struct`
clap = { version = "4.6", features = ["derive"] }
# The system's standard data folder (~/.local/share, ~/Library/Application Support)
dirs = "7.0"
# `canonicalize` without Windows' `\\?\C:\…` prefix (same as std on Mac and Linux)
dunce = "1.0"
# Folder watching (inotify on Linux, FSEvents on Mac), with event grouping
# and matching of both ends of a rename
notify-debouncer-full = "0.7"
# Audio playback (relies on CoreAudio on Mac, ALSA on Linux)
rodio = { version = "0.23", features = ["symphonia-all"] }
# SQLite database; `bundled` compiles SQLite with the project, nothing to install on Mac or Linux;
# `functions` lets the search use Rust's lowercase, which knows accents (`unicode_lower`)
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
# Turns Rust values into JSON for the graphical interface (already a
# dependency of Tauri, so nothing more to compile)
serde = { version = "1", features = ["derive"] }
# Audio decoding and file info (same version as the one rodio uses)
symphonia = { version = "0.5", features = ["all"] }
# Deleting a sample sends it to the system's trash (freedesktop on Linux,
# the Finder's on Mac), where it can be got back
trash = "5.3"
# Recursive folder walking
walkdir = "2.5"

# The graphical interface (src-tauri/) is a second package of the same
# workspace: one Cargo.lock and one target/ folder for both.
[workspace]
members = ["src-tauri"]
exclude = ["vendor/drag"]

# Copy of the `drag` crate (used by tauri-plugin-drag) with two Linux fixes:
# file URIs are escaped (a `#` or a space broke the path), and the drag's
# signal handlers stay connected until the next drag, so the receiver can
# still ask for the file after the drop.
# Upstream issue: https://github.com/crabnebula-dev/drag-rs/issues/84
[patch.crates-io]
drag = { path = "vendor/drag" }

# Dependencies compiled with optimisations even in debug builds (`cargo run`):
# unoptimised, symphonia decodes an MP3 about 30 times slower (2.3 s instead
# of 0.07 s for the waveform of a 54 s file). Our own code stays in debug, to
# keep compiling fast and debugging easy. Applies to the whole workspace.
[profile.dev.package."*"]
opt-level = 3
