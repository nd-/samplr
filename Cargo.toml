[package]
name = "samplr"
version = "0.1.0"
edition = "2024"

[dependencies]
# Command-line argument parsing, described by a `struct`
clap = { version = "4.6", features = ["derive"] }
# The system's standard data folder (~/.local/share, ~/Library/Application Support)
dirs = "7.0"
# `canonicalize` without Windows' `\\?\C:\…` prefix (same as std on Mac and Linux)
dunce = "1.0"
# Folder watching (inotify on Linux, FSEvents on Mac), with event grouping
# and matching of both ends of a rename
notify-debouncer-full = "0.7"
# Audio playback (relies on CoreAudio on Mac, ALSA on Linux)
rodio = { version = "0.23", features = ["symphonia-all"] }
# SQLite database; `bundled` compiles SQLite with the project, nothing to install on Mac or Linux
rusqlite = { version = "0.41", features = ["bundled"] }
# Audio decoding and file info (same version as the one rodio uses)
symphonia = { version = "0.5", features = ["all"] }
# Recursive folder walking
walkdir = "2.5"
