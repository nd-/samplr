<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>samplr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search: words in the path, #tag" autofocus spellcheck="false">
  </header>
  <canvas id="wave"></canvas>
  <main id="list" tabindex="-1">
    <table>
      <thead>
        <tr><th>Name</th><th>Folder</th><th class="number">Length</th><th>Tags</th></tr>
      </thead>
      <tbody id="samples"></tbody>
    </table>
  </main>
  <footer>
    <span id="status"></span>
    <span class="keys">↑ ↓ browse and play · Enter replay · Esc stop</span>
  </footer>
  <script src="main.js"></script>
</body>
</html>
