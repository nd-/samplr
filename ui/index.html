<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>samplr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search: words in the path, #tag" autofocus spellcheck="false">
    <button id="play" type="button" title="Play once (Enter)">▶ Play</button>
    <button id="play-loop" type="button" title="Play in a loop, this sample and the next ones selected" aria-pressed="false">↻ Play loop</button>
    <button id="stop" type="button" title="Stop playback (Esc)" disabled>■ Stop</button>
    <label id="volume-box" title="Preview volume">Vol. <input id="volume" type="range" min="0" max="100" value="80"></label>
    <button id="add-folder" type="button" title="Add a folder of samples">+ Folder</button>
    <button id="show-folders" type="button" title="The scanned folders">Folders…</button>
  </header>
  <div id="wave-box">
    <canvas id="wave"></canvas>
    <div id="playhead" hidden></div>
  </div>
  <div id="tagbar">
    <span id="tags"></span>
    <input id="new-tags" type="text" placeholder="Add tags" spellcheck="false" disabled>
  </div>
  <main id="list" tabindex="-1">
    <table>
      <thead>
        <tr><th>Name</th><th>Folder</th><th class="number">Length</th><th>Tags</th></tr>
      </thead>
      <tbody id="samples"></tbody>
    </table>
  </main>
  <footer>
    <span id="status-box">
      <progress id="scan-bar" hidden></progress>
      <span id="status"></span>
    </span>
    <span class="keys">↑ ↓ browse and play · Enter replay · Esc stop · Ctrl+T tag · drag a row into your DAW</span>
  </footer>
  <dialog id="folders">
    <h2>Scanned folders</h2>
    <ul id="folder-list"></ul>
    <p class="hint">Removing a folder takes its samples out of the list. Their tags are kept, and come back if the folder is added again. The audio files are not touched.</p>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <script src="main.js"></script>
</body>
</html>
